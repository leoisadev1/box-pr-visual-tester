<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR #1 visual review comment</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--canvas); font-size: 15px; }
  .page { width: 1240px; padding: 36px 40px 40px; }
  .pr-head { padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<div class="page" id="root"></div>
<script type="module">
  import { commentHTML, prHeadHTML } from "./comment.js";
  const m = await (await fetch("../artifacts/run-metrics.json")).json();
  document.getElementById("root").innerHTML =
    prHeadHTML({ avatar: "../assets/leodev.png" }) +
    commentHTML({ m, shots: { before: "../artifacts/before-mobile.png", after: "../artifacts/after-mobile.png" }, shotWidth: 250 });
  await Promise.all([...document.images].map((img) => img.decode()));
  await document.fonts.ready;
  document.body.dataset.ready = "1";
</script>
</body>
</html>
